spring.application.name=authforge
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-binding-errors=never

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/authforge}
spring.datasource.username=${DATABASE_USERNAME:authforge}
spring.datasource.password=${DATABASE_PASSWORD:change-me}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

app.jwt.issuer=${JWT_ISSUER:authforge}
app.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT10M}
app.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:P7D}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
