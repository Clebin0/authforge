spring.datasource.url=jdbc:h2:mem:authforge;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=true

app.jwt.issuer=authforge-test
app.jwt.secret-base64=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==
app.jwt.access-token-ttl=PT5M
app.jwt.refresh-token-ttl=PT1H
app.cors.allowed-origins=http://localhost:3000
app.bootstrap-admin.email=admin@authforge.local
app.bootstrap-admin.password=test-bootstrap-admin-password-2026
